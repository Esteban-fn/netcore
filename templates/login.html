<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NetCore — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../static/css/style.css"/>
</head>

<body>
    
<canvas id="topo"></canvas>

<div class="login-wrapper">
  <div class="login-card">

    <div class="brand">
      <!-- Ícone SVG: nó de rede/topologia -->
      <div class="brand-icon">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="28" cy="10" r="5" fill="#00aaff" opacity=".9"/>
          <circle cx="10" cy="42" r="5" fill="#00aaff" opacity=".9"/>
          <circle cx="46" cy="42" r="5" fill="#00aaff" opacity=".9"/>
          <circle cx="28" cy="28" r="4" fill="#004488" stroke="#00aaff" stroke-width="1.5"/>
          <line x1="28" y1="15" x2="28" y2="24" stroke="#00aaff" stroke-width="1.2" opacity=".6"/>
          <line x1="24" y1="30" x2="14" y2="38" stroke="#00aaff" stroke-width="1.2" opacity=".6"/>
          <line x1="32" y1="30" x2="42" y2="38" stroke="#00aaff" stroke-width="1.2" opacity=".6"/>
          <line x1="10" y1="37" x2="28" y2="15" stroke="#0055cc" stroke-width=".8" opacity=".3" stroke-dasharray="3 3"/>
          <line x1="46" y1="37" x2="28" y2="15" stroke="#0055cc" stroke-width=".8" opacity=".3" stroke-dasharray="3 3"/>
          <line x1="10" y1="42" x2="46" y2="42" stroke="#0055cc" stroke-width=".8" opacity=".3" stroke-dasharray="3 3"/>
        </svg>
      </div>
      <h1>NET<span>CORE</span></h1>
      <p>NETWORK TOPOLOGY PLATFORM</p>
    </div>

    <div class="section-label">AUTENTICAÇÃO</div>

    <form>
      <div class="mb-3">
        <label class="form-label">ENDEREÇO / USUÁRIO</label>
        <input type="text" class="form-control" placeholder="usuario@dominio.local" autocomplete="username"/>
      </div>

      <div class="mb-3">
        <label class="form-label">CHAVE DE ACESSO</label>
        <input type="password" class="form-control" placeholder="••••••••••••" autocomplete="current-password"/>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="lembrar"/>
          <label class="form-check-label" for="lembrar">Manter sessão</label>
        </div>
        <a href="#" class="link-aux">Recuperar acesso →</a>
      </div>

      <button type="submit" class="btn-connect">
        ▶ CONECTAR À REDE
      </button>
    </form>

    <div class="status-bar">
      <div><span class="status-dot"></span> SERVIDOR ATIVO · 192.168.0.1</div>
      <div>TLS 1.3 · AES-256</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // ── Topologia animada (canvas) ──────────────────────────
  const canvas = document.getElementById('topo');
  const ctx = canvas.getContext('2d');
  let W, H, nodes = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function initNodes() {
    nodes = [];
    const count = Math.floor((W * H) / 18000);
    for (let i = 0; i < count; i++) {
      nodes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - .5) * .4,
        vy: (Math.random() - .5) * .4,
        r: Math.random() * 2.5 + 1.5,
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // mover nós
    for (const n of nodes) {
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0 || n.x > W) n.vx *= -1;
      if (n.y < 0 || n.y > H) n.vy *= -1;
    }

    // arestas
    const MAX_DIST = 160;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const d  = Math.sqrt(dx*dx + dy*dy);
        if (d < MAX_DIST) {
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.strokeStyle = `rgba(0,120,220,${(1 - d/MAX_DIST) * .6})`;
          ctx.lineWidth = .8;
          ctx.stroke();
        }
      }
    }

    // nós
    for (const n of nodes) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,170,255,.85)';
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  resize();
  initNodes();
  draw();
  window.addEventListener('resize', () => { resize(); initNodes(); });
</script>

</body>
</html>
